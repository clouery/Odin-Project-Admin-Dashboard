<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="header">

            <div class="row1">
                <div class="left">
                    <img src="" alt="search">
                    <!-- search bar here -->
                    <!-- <label for="search">there is a search bar here</label> -->
                    <input type="text" name="search" id="search">
                </div>

                <div class="right">
                    <!-- bell icon -->
                    <img src="" alt="">

                    <!-- profile area -->
                    <img src="" alt="profile pic">
                    <p class="name">name here</p>
                </div>
            </div>


            <!-- bigger here  -->
            <div class="row2">
                <div class="left">
                    <img src="" alt="bigger pic">
                    <div class="greet">
                        <p>Hi there,</p>
                        <p>NAME PLACEHOLDER</p>
                    </div>

                </div>
                <div class="right">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>

        </div>

        <div class="sidebar">
            <div class="logo">
                <img src="" alt="logo here">
                <p>Dashboard</p>
            </div>
            <div class="item1">
                <div class="set">
                    <img src="" alt="home">
                    <p class="word">HOME</p>
                </div>
                <div class="set">
                    <img src="" alt="profile">
                    <p class="word">PROFILE</p>
                </div>
                <div class="set">
                    <img src="" alt="messages">
                    <p class="word">MESSAGES</p>
                </div>
                <div class="set">
                    <img src="" alt="history">
                    <p class="word">HISTORY</p>
                </div>
                <div class="set">
                    <img src="" alt="tasks">
                    <p class="word">TASKS</p>
                </div>
                <div class="set">
                    <img src="" alt="communities">
                    <p class="word">COMMUNITIES</p>
                </div>
            </div>

            <div class="item2">
                <div class="set">
                    <img src="" alt="settings">
                    <p class="word">SETTINGS</p>
                </div>
                <div class="set">
                    <img src="" alt="support">
                    <p class="word">SUPPORT</p>
                </div>
                <div class="set">
                    <img src="" alt="privacy">
                    <p class="word">PRIVACY</p>
                </div>

            </div>
        </div>

        <div class="main">

        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="header">

            <div class="row1">
                <div class="left">
                    <img src="pics/magnify.svg" alt="search">
                    <!-- search bar here -->
                    <!-- <label for="search">there is a search bar here</label> -->
                    <input type="text" name="search" id="search">
                </div>

                <div class="right">
                    <!-- bell icon -->
                    <img src="pics/bell-outline.svg" alt="notification">

                    <!-- profile area -->
                    <img class="profile" src="pics/profile.jpg" alt="profile pic">
                    <p class="name">Xiang Zhi</p>
                </div>
            </div>


            <!-- bigger here  -->
            <div class="row2">
                <div class="left">
                    <img class="profile" src="pics/profile.jpg" alt="bigger pic">
                    <div class="greet">
                        <p>Hi there,</p>
                        <p class="paraname">Xiang Zhi</p>
                    </div>

                </div>
                <div class="right">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>

        </div>

        <div class="sidebar">
            <div class="logo">
                <img src="pics/view-dashboard.svg" alt="logo here">
                <p>Dashboard</p>
            </div>
            <div class="item1">
                <div class="set">
                    <img src="pics/home-account.svg" alt="home">
                    <a href="#">Home</a>
                </div>
                <div class="set">
                    <img src="pics/account.svg" alt="profile">
                    <a href="#">Profile</a>
                </div>
                <div class="set">
                    <img src="pics/message.svg" alt="messages">
                    <a href="#">Messages</a>
                </div>
                <div class="set">
                    <img src="pics/history.svg" alt="history">
                    <a href="#">History</a>
                </div>
                <div class="set">
                    <img src="pics/note-multiple.svg" alt="tasks">
                    <a href="#">Tasks</a>
                </div>
                <div class="set">
                    <img src="pics/account-group.svg" alt="communities">
                    <a href="#">Communities</a>
                </div>
            </div>

            <div class="item2">
                <div class="set">
                    <img src="pics/cog.svg" alt="settings">
                    <a href="#">Settings</a>
                </div>
                <div class="set">
                    <img src="pics/face-agent.svg" alt="support">
                    <a href="#">Support</a>
                </div>
                <div class="set">
                    <img src="pics/security.svg" alt="privacy">
                    <a href="#">Privacy</a>
                </div>

            </div>
        </div>

        <div class="main">
            <div class="yourprojects">
                <p>Your Projects</p>
                <div class="projects">
                    <div class="project">Project</div>
                    <div class="project">Project</div>
                    <div class="project">Project</div>
                    <div class="project">Project</div>
                    <div class="project">Project</div>
                    <div class="project">Project</div>

                </div>
            </div>
            <div class="extra">
                <div class="announcements">
                    <p class="title">Annoucements</p>
                    <div class="box">
                        box here
                    </div>
                </div>

                <div class="trending">
                    <p class="title">Trending</p>
                    <div class="box">
                        box here
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Made By Xiang Zhi</p>
        </div>
    </div>
</body>

</html>
